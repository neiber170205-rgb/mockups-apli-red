<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root{
      --canvas:oklch(98.5% .004 220); --surface:oklch(100% 0 0); --surface2:oklch(96.8% .005 220); --surface3:oklch(93.8% .007 220);
      --line:oklch(91.5% .007 220); --line2:oklch(84.5% .010 220);
      --fg:oklch(24% .018 235); --fg2:oklch(47% .014 235); --fg3:oklch(60% .012 235);
      --accent:oklch(46% .098 210); --accent-hover:oklch(40% .104 210); --accent-fg:oklch(99% 0 0);
      --accent-soft:oklch(95.5% .024 210); --accent-line:oklch(87% .052 210);
      --success:oklch(50% .120 155); --success-soft:oklch(95.5% .032 155);
      --warning:oklch(56% .110 75); --warning-soft:oklch(96% .042 80);
      --danger:oklch(52% .170 27); --danger-soft:oklch(96% .032 27);
      --thead-bg:oklch(30% .015 235); --thead-fg:oklch(93% .010 235);
      --sh-sm:0 1px 2px oklch(24% .018 235/.06); --sh-md:0 4px 12px oklch(24% .018 235/.10);
      --f-sans:"Inter",system-ui,-apple-system,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--f-sans);background:var(--canvas);color:var(--fg);-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none} a:hover{color:var(--accent-hover)}
    ::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
  </style>
  <style>
    /* Densidad TÁCTIL: el mesero, no el escritorio. Teclas de 72 px, muy por
       encima de los 44 de mínimo, porque esto se teclea de pie, con una mano y
       a veces con la bandeja en la otra. */
    .pin .tecla{ display:flex; align-items:center; justify-content:center; height:72px;
                 border-radius:8px; background:var(--surface); border:1px solid var(--line2);
                 font-family:var(--f-mono); font-size:26px; font-weight:500; box-shadow:var(--sh-sm); }
    .pin .punto{ width:16px; height:16px; border-radius:50%; }
  </style>
</helmet>
<div class="pin" style="width:390px;height:844px;display:flex;flex-direction:column;background:var(--canvas);font-size:15px;overflow:hidden">

  <div style="flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:34px 18px 0">
    <span style="display:grid;place-items:center;width:30px;height:30px;flex-shrink:0;border-radius:7px;background:var(--accent);color:var(--accent-fg)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 2v9a3 3 0 006 0V2"/><path d="M10 2v20"/><path d="M18 2c-1.5 2-2 4-2 7v4h3V2z"/></svg></span>
    <div style="display:flex;flex-direction:column;gap:1px">
      <span style="font-size:18px;font-weight:600;line-height:22px">La Cava del Llano</span>
      <span style="font-size:13px;color:var(--fg3);line-height:16px">Sede Centro</span>
    </div>
  </div>

  <!-- EL TELÉFONO YA SABE QUIÉN ES.
       Es lo que compra la inscripción del dispositivo: el equipo quedó atado a
       una persona (`dispositivo.propiedad = 'byod'` con su `usuario_id`), así
       que aquí NO se teclea el usuario, solo el PIN. Pedir usuario y clave en
       un celular propio, veinte veces por turno, es como se acaba con el PIN
       pegado con cinta detrás del teléfono. -->
  <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 18px 0">
    <span style="display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:22px;font-weight:700;color:var(--accent);letter-spacing:-.02em">DR</span>
    <span style="font-size:20px;font-weight:600;line-height:26px">Hola, Danilo</span>
    <span style="font-size:13px;color:var(--fg3)">Mesero · escribe tu PIN</span>
  </div>

  <div style="flex-shrink:0;display:flex;justify-content:center;gap:14px;padding:26px 0 22px">
    <span class="punto" style="background:var(--accent)"></span>
    <span class="punto" style="background:var(--accent)"></span>
    <span class="punto" style="background:var(--accent)"></span>
    <span class="punto" style="background:var(--surface3);border:1px solid var(--line2)"></span>
  </div>

  <div style="flex-grow:1;display:grid;grid-template-columns:repeat(3, 1fr);gap:12px;padding:0 18px;align-content:start">
    <div class="tecla">1</div><div class="tecla">2</div><div class="tecla">3</div>
    <div class="tecla">4</div><div class="tecla">5</div><div class="tecla">6</div>
    <div class="tecla">7</div><div class="tecla">8</div><div class="tecla">9</div>
    <div style="height:72px"></div>
    <div class="tecla">0</div>
    <div style="display:flex;align-items:center;justify-content:center;height:72px;border-radius:8px;color:var(--fg2)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"/><path d="M18 9l-6 6"/><path d="M12 9l6 6"/></svg>
    </div>
  </div>

  <div style="flex-shrink:0;display:flex;flex-direction:column;gap:12px;padding:14px 18px 26px">
    <!-- Sin geocerca aquí, y es deliberado: lo que la ubicación bloquea es
         ENVIAR la comanda, no entrar. Bloquear el acceso dejaría al mesero sin
         poder ni mirar el salón cada vez que el GPS parpadea. -->
    <div style="display:flex;justify-content:center">
      <span style="font-size:13px;font-weight:500;color:var(--accent)">Este no es mi teléfono</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
